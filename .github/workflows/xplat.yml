name: xplat

# Linux and Windows on the CPU, on real machines of each. Only this branch and
# manual runs: nothing from a fork reaches it.
on:
  push:
    branches: [xplat]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, goos: linux, goarch: amd64, exe: "" }
          - { runner: ubuntu-24.04-arm, goos: linux, goarch: arm64, exe: "" }
          - { runner: windows-2025, goos: windows, goarch: amd64, exe: ".exe" }
          - { runner: windows-11-arm, goos: windows, goarch: arm64, exe: ".exe" }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      CGO_ENABLED: "0"
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep test fixtures byte for byte
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Take libgomp from Ubuntu 22.04
        if: matrix.goos == 'linux'
        run: |
          docker run --rm -v "$PWD:/out" ubuntu:22.04 bash -c '
            apt-get update -qq &&
            apt-get install -y -qq --no-install-recommends libgomp1 &&
            cp -L /usr/lib/*-linux-gnu/libgomp.so.1 /out/libgomp.so.1'

      - name: Fetch llama.cpp's libraries
        run: |
          gomp=""
          [ "${{ matrix.goos }}" = linux ] && gomp="$PWD/libgomp.so.1"
          bash scripts/fetch-libs-other.sh ${{ matrix.goos }} ${{ matrix.goarch }} $gomp

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -ldflags "-s -w -X main.version=xplat-ci" -o kinfer-ci${{ matrix.exe }} ./cmd/kinfer

      - name: Unit tests
        run: go test ./... -count=1 -timeout 25m

      - name: A real model
        if: ${{ !cancelled() }}
        run: python .github/ci/smoke.py ./kinfer-ci${{ matrix.exe }}

  # Windows x86-64 replied in repeated words on a Zen 4 machine while every other
  # platform was right: which layer is it?
  windows-amd64-diag:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CGO_ENABLED: "0"
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep test fixtures byte for byte
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build kinfer, with and without the AVX-512 libraries
        run: |
          bash scripts/fetch-libs-other.sh windows amd64
          go build -ldflags "-s -w -X main.version=diag" -o kinfer-ci.exe ./cmd/kinfer
          cd internal/nativelib/libs/windows_amd64_b11998
          rm ggml-cpu-zen4.dll ggml-cpu-icelake.dll ggml-cpu-sapphirerapids.dll ggml-cpu-skylakex.dll ggml-cpu-cannonlake.dll ggml-cpu-cascadelake.dll ggml-cpu-cooperlake.dll
          cd -
          go build -ldflags "-s -w -X main.version=diag-no512" -o kinfer-no512.exe ./cmd/kinfer
      - name: Fetch llama.cpp's own server
        run: |
          curl -fsSL -o upstream.zip https://github.com/ggml-org/llama.cpp/releases/download/b11998/llama-b11998-bin-win-cpu-x64.zip
          echo "2cdb7ff52769dff9bf19c4cf7d6b6e136e7b46249679d5d92ecd92631b8f7fb2  upstream.zip" | sha256sum -c -
          mkdir upstream && unzip -q upstream.zip -d upstream
      - name: The same questions at every layer
        run: python .github/ci/diag.py kinfer-ci.exe kinfer-no512.exe upstream
