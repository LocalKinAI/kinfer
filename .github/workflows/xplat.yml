name: xplat

# Linux and Windows on the CPU, on real machines of each. Only this branch and
# manual runs: nothing from a fork reaches it.
on:
  push:
    branches: [xplat]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, goos: linux, goarch: amd64, exe: "" }
          - { runner: ubuntu-24.04-arm, goos: linux, goarch: arm64, exe: "" }
          - { runner: windows-2025, goos: windows, goarch: amd64, exe: ".exe" }
          - { runner: windows-11-arm, goos: windows, goarch: arm64, exe: ".exe" }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      CGO_ENABLED: "0"
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep test fixtures byte for byte
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch llama.cpp's libraries
        run: bash scripts/fetch-libs-other.sh ${{ matrix.goos }} ${{ matrix.goarch }}

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -ldflags "-s -w -X main.version=xplat-ci" -o kinfer-ci${{ matrix.exe }} ./cmd/kinfer

      - name: Unit tests
        run: go test ./... -count=1 -timeout 25m

      - name: A real model
        if: ${{ !cancelled() }}
        run: python .github/ci/smoke.py ./kinfer-ci${{ matrix.exe }}

  # What a release ships, installed the way a user installs it. Linux in a
  # container with nothing added but what the install and the test itself use.
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, goos: linux, goarch: amd64 }
          - { runner: ubuntu-24.04-arm, goos: linux, goarch: arm64 }
          - { runner: windows-2025, goos: windows, goarch: amd64 }
          - { runner: windows-11-arm, goos: windows, goarch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      KINFER_VERSION: v0.0.0-ci
      KINFER_BASE_URL: http://127.0.0.1:8765
    steps:
      - name: Keep test fixtures byte for byte
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Package
        run: bash scripts/package-other.sh $KINFER_VERSION ${{ matrix.goos }} ${{ matrix.goarch }}
      - name: Install and run on a clean Linux
        if: matrix.goos == 'linux'
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory dist &
          sleep 2
          docker run --rm --network host -e KINFER_VERSION -e KINFER_BASE_URL -v "$PWD:/src:ro" ubuntu:24.04 bash -c '
            set -e
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends curl python3 ca-certificates >/dev/null
            sh /src/scripts/install.sh
            python3 /src/.github/ci/smoke.py ~/.local/bin/kinfer'
      - name: Install and run on Windows
        if: matrix.goos == 'windows'
        shell: powershell
        run: |
          Start-Process -FilePath python -ArgumentList '-m','http.server','8765','--bind','127.0.0.1','--directory','dist' -WindowStyle Hidden
          Start-Sleep -Seconds 3
          ./scripts/install.ps1
          $k = Join-Path $env:LOCALAPPDATA 'Programs\kinfer\kinfer.exe'
          & $k version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python .github/ci/smoke.py $k
          exit $LASTEXITCODE

  # The GPU path, on Mesa's software Vulkan: the backend fetched on first use,
  # tried in a child process, and a real model served through it. It says
  # nothing about the speed or the memory of a real GPU.
  vulkan:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, goarch: amd64 }
          - { runner: ubuntu-24.04-arm, goarch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: "0"
      GGML_VK_VISIBLE_DEVICES: "0" # llama.cpp passes over a CPU driver unless told
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: A software Vulkan driver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libvulkan1 mesa-vulkan-drivers
      - name: Build
        run: |
          bash scripts/fetch-libs-other.sh linux ${{ matrix.goarch }}
          go build -ldflags "-s -w -X main.version=xplat-ci" -o kinfer-ci ./cmd/kinfer
      - name: Selftest
        run: |
          ./kinfer-ci pull Qwen/Qwen2.5-0.5B-Instruct-GGUF:qwen2.5-0.5b-instruct-q4_k_m.gguf
          ./kinfer-ci selftest qwen2.5-0.5b-instruct-q4_k_m | tee selftest.txt
          grep -q 'on GPU Vulkan0' selftest.txt
      - name: A real model, served on the GPU path
        run: python .github/ci/smoke.py ./kinfer-ci
