name: backends-diag

# Temporary: what is in llama.cpp's CUDA and ROCm archives, and what each
# backend library needs at load time.
on:
  push:
    branches: [xplat]
    paths: [.github/workflows/backends-diag.yml]

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Inspect
        run: |
          pip install -q pefile
          B=https://github.com/ggml-org/llama.cpp/releases/download/b11998
          peimports() {
            python3 - "$1" <<'PY'
          import pefile, sys
          p = pefile.PE(sys.argv[1], fast_load=True)
          p.parse_data_directories(directories=[pefile.DIRECTORY_ENTRY['IMAGE_DIRECTORY_ENTRY_IMPORT']])
          print('   imports:', sorted(e.dll.decode().lower() for e in p.DIRECTORY_ENTRY_IMPORT if not e.dll.decode().lower().startswith('api-ms-')))
          PY
          }
          for f in llama-b11998-bin-ubuntu-cuda-13.4-x64.tar.gz cudart-llama-b11998-bin-ubuntu-cuda-13.4-x64.tar.gz llama-b11998-bin-ubuntu-rocm-10.0-x64.tar.gz; do
            echo "=================== $f"
            rm -rf x; mkdir x; curl -fsSL "$B/$f" | tar xz -C x
            find x -type f -printf '%s %p\n' | sort -n | tail -14
            find x -type l -printf 'link %p -> %l\n' | head -12
            for s in $(find x -type f \( -name 'libggml-cuda*.so*' -o -name 'libggml-hip*.so*' \)); do echo "--- $s"; readelf -d "$s" | grep -E 'NEEDED|RUNPATH' | sed 's/.*Shared library: //; s/.*Library runpath: /runpath /'; done
          done
          for f in llama-b11998-bin-win-cuda-13.4-x64.zip cudart-llama-bin-win-cuda-13.4-x64.zip llama-b11998-bin-win-rocm-10.0-x64.zip; do
            echo "=================== $f"
            rm -rf x; mkdir x; curl -fsSL -o a.zip "$B/$f"; unzip -q a.zip -d x
            find x -type f -iname '*.dll' -printf '%s %f\n' | sort -n | tail -14
            for s in $(find x -type f \( -iname 'ggml-cuda*.dll' -o -iname 'ggml-hip*.dll' \)); do echo "--- $s"; peimports "$s"; done
          done
